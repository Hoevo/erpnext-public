name: Contract Ops extension checks
on:
  push:
    paths: ['extensions/contract_ops/**', '.github/workflows/contract-ops-checks.yml']
  pull_request:
    paths: ['extensions/contract_ops/**', '.github/workflows/contract-ops-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python extensions/contract_ops/tools/check_extension.py
      - run: python -m unittest discover -s extensions/contract_ops/offline_tests -v
