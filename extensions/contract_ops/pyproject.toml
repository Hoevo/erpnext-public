[build-system]
requires = ["flit_core>=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "contract_ops"
authors = [{name = "Contract Ops Contributors"}]
description = "Sales contracts and VAT invoice registers for ERPNext"
requires-python = ">=3.11"
dynamic = ["version"]

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"
